# =====================
# Server
# =====================
server.port=8080

# =====================
# Datasource
# =====================
spring.datasource.url=jdbc:mysql://localhost:3306/smartops_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=<REPLACE_WITH_DB_PASSWORD>
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =====================
# JWT
# =====================
jwt.secret=<REPLACE_WITH_JWT_SECRET>
jwt.expiration-ms=86400000

# =====================
# Azure OpenAI
# DO NOT hardcode keys in source. Use environment variables or externalized config.
# =====================
azure.openai.key=${AZURE_OPENAI_KEY:<REPLACE_WITH_KEY>}
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:https://your-resource.openai.azure.com/}
azure.openai.deployment=${AZURE_OPENAI_DEPLOYMENT:gpt-4o}
azure.openai.api-version=${AZURE_OPENAI_API_VERSION:2025-01-01-preview}
